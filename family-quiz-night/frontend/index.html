<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Family Quiz Night</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0b10;--surface:#12141d;--card:#181b27;--card-hover:#1e2233;
  --accent:#6d5cff;--accent-dim:rgba(109,92,255,0.12);
  --text:#eae8f2;--sub:#9993ab;--muted:#4a4560;--faint:#2a273a;
  --ok:#2dd4a0;--ok-bg:rgba(45,212,160,0.06);
  --bdr:rgba(255,255,255,0.05);--bdr2:rgba(255,255,255,0.08);
  --radius:14px;--radius-lg:18px;
}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hdr{position:sticky;top:0;z-index:200;background:rgba(10,11,16,0.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--bdr);padding:14px 20px;display:flex;align-items:center;gap:12px}
.hdr-title{font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:700;flex:1}
.hdr-title em{font-style:normal;color:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:10px}
.btn-back{background:none;border:1px solid var(--bdr2);color:var(--sub);font-size:.72rem;font-weight:600;padding:6px 14px;border-radius:100px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.btn-back:hover{color:var(--text);border-color:var(--muted)}
.badge-sm{font-size:.7rem;color:var(--sub);background:var(--surface);padding:5px 13px;border-radius:100px}
.badge-sm strong{color:var(--ok)}
.launcher{padding:30px 20px 40px;max-width:480px;margin:0 auto}
.launcher-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:16px}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic-cell{background:var(--surface);border:1px solid var(--bdr);border-radius:var(--radius-lg);padding:20px 16px;cursor:pointer;transition:all .25s ease;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;overflow:hidden}
.topic-cell::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--tc),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.topic-cell:hover{transform:translateY(-3px);border-color:var(--faint)}
.topic-cell:hover::after{opacity:.08}
.topic-cell:active{transform:scale(.96)}
.topic-icon{font-size:1.6rem;line-height:1}
.topic-name{font-size:.82rem;font-weight:700;position:relative;z-index:1}
.topic-count{font-size:.62rem;color:var(--muted);position:relative;z-index:1}
.picker{padding:16px 20px 40px;max-width:520px;margin:0 auto}
.round-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--bdr);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rcard:hover{border-color:var(--faint);transform:translateY(-2px)}
.rcard:active{transform:scale(.97)}
.rcard-stripe{height:3px;border-radius:2px;margin-bottom:12px;opacity:.7}
.rcard-title{font-size:.82rem;font-weight:700;line-height:1.3;margin-bottom:6px;flex:1}
.rcard-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.rcard-count{font-size:.6rem;color:var(--muted)}
.rcard-new{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:100px}
.grid{padding:10px 16px 130px;display:flex;flex-direction:column;gap:10px;max-width:600px;margin:0 auto}
.qcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radius);overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:all .25s}
.qcard:active{transform:scale(.985)}
.qcard.show{border-color:rgba(45,212,160,0.18);background:var(--ok-bg)}
.qi{padding:16px 18px}
.qt{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qn{font-family:'JetBrains Mono',monospace;font-size:.58rem;font-weight:700;color:var(--faint);min-width:28px}
.qcat{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:100px;background:rgba(255,255,255,0.04)}
.qhint{margin-left:auto;font-size:.6rem;color:var(--muted);opacity:.5}
.qtxt{font-size:.88rem;line-height:1.55;font-weight:500}
.qtxt pre{font-family:'JetBrains Mono',monospace;font-size:.45rem;line-height:1.1;letter-spacing:.05em;color:var(--accent);margin-top:8px;overflow-x:auto;white-space:pre}
.qans{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease;opacity:0}
.qcard.show .qans{max-height:250px;opacity:1}
.qansi{padding:12px 18px 16px;border-top:1px solid var(--bdr)}
.qal{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ok);font-weight:700;margin-bottom:4px}
.qat{font-size:.88rem;font-weight:600;color:var(--ok);line-height:1.45}
.fabs{position:fixed;bottom:22px;right:16px;display:flex;gap:10px;z-index:90}
.fab{background:var(--accent);color:white;border:none;height:44px;border-radius:var(--radius);font-size:.78rem;cursor:pointer;box-shadow:0 4px 24px rgba(109,92,255,0.2);display:flex;align-items:center;gap:6px;padding:0 16px;font-weight:600;font-family:inherit;transition:all .2s}
.fab:hover{box-shadow:0 6px 30px rgba(109,92,255,0.35)}
.fab:active{transform:scale(.93)}
.fab.sec{background:rgba(255,255,255,0.06);box-shadow:none}
.fab.sec:hover{background:rgba(255,255,255,0.1)}
.emoji-q{font-size:1.8rem;letter-spacing:4px;padding:12px 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.topic-cell,.rcard,.qcard{animation:fadeUp .4s ease both}
/* ── Carousel mode (picture / emoji rounds) ── */
.car{position:fixed;inset:0;padding-top:54px;display:flex;flex-direction:column;background:var(--bg);z-index:50}
.car-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;align-items:center;justify-content:center}
.car-card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--bdr);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;align-items:stretch;gap:14px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:border-color .25s,background .25s;animation:fadeUp .35s ease both}
.car-card.show{border-color:rgba(45,212,160,0.18);background:var(--ok-bg)}
.car-meta{display:flex;align-items:center;justify-content:space-between;width:100%}
.car-meta .qn{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;color:var(--sub)}
.car-cat{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 11px;border-radius:100px;background:rgba(255,255,255,0.04)}
.car-media{display:flex;align-items:center;justify-content:center;width:100%;min-height:180px}
.car-hint{font-size:.92rem;color:var(--sub);line-height:1.5;text-align:center;font-style:italic;padding:0 8px}
.car-ans{width:100%;max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .3s ease}
.car-card.show .car-ans{max-height:320px;opacity:1}
.car-ans-i{border-top:1px solid var(--bdr);padding-top:14px;text-align:center}
.car-al{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ok);font-weight:700;margin-bottom:6px}
.car-at{font-size:1.05rem;font-weight:600;color:var(--ok);line-height:1.45}
.car .emoji-q{font-size:clamp(2.4rem,12vw,4.8rem);letter-spacing:.18em;padding:8px 0;text-align:center;line-height:1.15}
.car-nav{display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);background:var(--surface)}
.car-btn{flex:1;height:52px;background:rgba(255,255,255,0.06);border:none;border-radius:var(--radius);color:var(--text);font-size:.82rem;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.car-btn:hover{background:rgba(255,255,255,0.1)}
.car-btn:active{transform:scale(.96)}
.car-btn:disabled{opacity:.3;cursor:not-allowed}
.car-btn:disabled:active{transform:none}
.car-btn.primary{background:var(--accent);color:#fff;flex:1.4;box-shadow:0 4px 24px rgba(109,92,255,0.2)}
.car-btn.primary:hover{background:var(--accent);box-shadow:0 6px 30px rgba(109,92,255,0.35)}
/* ── Picture round (dynamic bank + random process) ── */
.pic-host{width:100%;display:flex;justify-content:center;align-items:center;min-height:240px;position:relative}
.pic-host img.pic-out,.pic-host canvas.pic-canvas,.pic-host img.pic-orig{max-width:100%;width:100%;max-width:380px;border-radius:12px;display:block;background:var(--bg)}
.pic-host pre.pic-ascii{font-family:'JetBrains Mono','Courier New',monospace;font-weight:700;font-size:clamp(.46rem,1.6vw,.66rem);line-height:1;letter-spacing:0;color:var(--text);white-space:pre;text-align:center;margin:0;background:#000;padding:10px 8px;border-radius:10px;overflow-x:auto;max-width:100%}
.pic-loading{font-size:.85rem;color:var(--muted);font-style:italic;padding:40px 0}
.pic-mode{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;margin-top:6px}
.pic-hint-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--bdr2);color:var(--sub);font-size:.78rem;font-weight:600;font-family:inherit;padding:8px 16px;border-radius:100px;cursor:pointer;transition:all .2s;align-self:center}
.pic-hint-btn:hover{background:rgba(255,255,255,0.08);color:var(--text);border-color:var(--muted)}
/* ── Music round (audio bank) ── */
.music-host{width:100%;display:flex;justify-content:center;align-items:center;min-height:240px;padding:18px 0}
.music-mystery{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%}
.music-mystery .music-icon{font-size:5rem;opacity:.45;line-height:1}
.music-revealed{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.music-title{font-size:1.45rem;font-weight:700;color:var(--text);text-align:center;line-height:1.25}
.music-artist{font-size:1.05rem;color:var(--accent);font-weight:600;text-align:center}
.music-album{font-size:.85rem;color:var(--sub);font-style:italic;text-align:center}
.music-revealed .music-player{margin-top:14px}
.music-player{width:100%;max-width:380px;border-radius:8px}
audio.music-player::-webkit-media-controls-panel{background-color:var(--surface)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const TOPICS=[
  {id:"food",icon:"🍽️",name:"Food & Drink",color:"#a78bfa"},
  {id:"science",icon:"🔬",name:"Science",color:"#60a5fa"},
  {id:"history",icon:"📜",name:"History",color:"#f59e0b"},
  {id:"geography",icon:"🌍",name:"Geography",color:"#34d399"},
  {id:"movies",icon:"🎬",name:"Movies",color:"#e879f9"},
  {id:"music",icon:"🎵",name:"Music",color:"#22d3ee"},
  {id:"sport",icon:"⚽",name:"Sport",color:"#fb923c"},
  {id:"nature",icon:"🌿",name:"Nature",color:"#4ade80"},
  {id:"picture",icon:"🖼️",name:"Picture Rounds",color:"#f97316"},
];

// Round data — lazy-loaded from frontend/data/.
//   rounds-index.json holds metadata for all rounds (id/topic/title/desc/type/count).
//   rounds/{id}.json holds the full round (incl. questions) — fetched on goQuiz.
let roundsIndex=null;       // array of round metadata
const roundsCache={};       // id → full round data once fetched
let bootstrapError=null;    // populated if rounds-index fails to load

async function loadRoundsIndex(){
  if(roundsIndex)return roundsIndex;
  const r=await fetch("data/rounds-index.json",{cache:"no-cache"});
  if(!r.ok)throw new Error("rounds-index fetch failed: "+r.status);
  const doc=await r.json();
  roundsIndex=doc.rounds||[];
  return roundsIndex;
}

async function loadRound(id){
  if(roundsCache[id])return roundsCache[id];
  const r=await fetch("data/rounds/"+id+".json",{cache:"no-cache"});
  if(!r.ok)throw new Error("round "+id+" fetch failed: "+r.status);
  const data=await r.json();
  roundsCache[id]=data;
  return data;
}

async function bootstrap(){
  try{ await loadRoundsIndex(); }
  catch(e){ console.error(e); bootstrapError=e.message||String(e); }
  render();
}


let view="topics",activeTopic=null,activeRound=null,revealed=new Set(),currentIdx=0;
// Picture-bank state — used by type:"picture" rounds (dynamic, random sampling)
let pictureBank=null;          // loaded JSON {version, items:[...]}
let pictureRound=null;         // {items:[...], modes:[...]} sampled for current round
let hintShown=new Set();       // per-question hint visibility
const picCache={};             // key: itemId+":"+mode → final processed HTML
const PIC_MODES=["blur","pixelate","ascii","mosaic"];

async function loadPictureBank(){
  if(pictureBank)return pictureBank;
  const r=await fetch("data/picture-bank.json",{cache:"force-cache"});
  if(!r.ok)throw new Error("picture-bank.json fetch failed: "+r.status);
  pictureBank=await r.json();
  return pictureBank;
}

async function buildPictureRound(N=10){
  const bank=await loadPictureBank();
  const pool=bank.items.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const items=pool.slice(0,Math.min(N,pool.length));
  const modes=items.map(()=>PIC_MODES[Math.floor(Math.random()*PIC_MODES.length)]);
  pictureRound={items,modes};
}

// Music-bank state — used by type:"music" rounds.
let musicBank=null;
let musicRound=null;

async function loadMusicBank(){
  if(musicBank)return musicBank;
  const r=await fetch("data/music-bank.json",{cache:"force-cache"});
  if(!r.ok)throw new Error("music-bank.json fetch failed: "+r.status);
  musicBank=await r.json();
  return musicBank;
}

async function buildMusicRound(N=10){
  const bank=await loadMusicBank();
  const pool=bank.items.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  musicRound={items:pool.slice(0,Math.min(N,pool.length))};
}

function processToCanvas(img,mode,canvas){
  const W=320;
  const H=Math.max(1,Math.round(W*img.naturalHeight/img.naturalWidth));
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext("2d");
  if(mode==="blur"){
    ctx.filter="blur("+Math.round(W*0.035)+"px)";
    ctx.drawImage(img,0,0,W,H);
    ctx.filter="none";
  } else if(mode==="pixelate"){
    const sw=18,sh=Math.max(1,Math.round(sw*H/W));
    const tmp=document.createElement("canvas");
    tmp.width=sw;tmp.height=sh;
    tmp.getContext("2d").drawImage(img,0,0,sw,sh);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(tmp,0,0,W,H);
  } else if(mode==="mosaic"){
    const cols=6,rows=8,tw=W/cols,th=H/rows;
    const sw=img.naturalWidth/cols,sh=img.naturalHeight/rows;
    const order=Array.from({length:cols*rows},(_,i)=>i);
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
    order.forEach((srcIdx,dstIdx)=>{
      const dr=Math.floor(dstIdx/cols),dc=dstIdx%cols;
      const sr=Math.floor(srcIdx/cols),sc=srcIdx%cols;
      ctx.drawImage(img,sc*sw,sr*sh,sw,sh,dc*tw,dr*th,tw,th);
    });
  }
}

// Density ramp ordered light → dense. On a dark UI, dense chars look brightest.
const ASCII_RAMP="  .,-':;~!=+ilJYUMW#%@$";

function asciiArt(img,width=84){
  const ar=img.naturalHeight/img.naturalWidth;
  const h=Math.max(1,Math.floor(width*ar*0.5));
  const c=document.createElement("canvas");
  c.width=width;c.height=h;
  const ctx=c.getContext("2d");
  ctx.drawImage(img,0,0,width,h);
  const d=ctx.getImageData(0,0,width,h).data;
  const N=ASCII_RAMP.length-1;
  let txt="";
  for(let y=0;y<h;y++){
    for(let x=0;x<width;x++){
      const i=(y*width+x)*4;
      // sRGB → linear-ish luminance, plus mild contrast stretch
      const lum=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;
      const b=Math.min(1,Math.max(0,Math.pow(lum,0.85)));
      txt+=ASCII_RAMP[Math.round(b*N)];
    }
    txt+="\n";
  }
  return txt;
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function buildProcessed(item,mode){
  const key=item.id+":"+mode;
  if(picCache[key])return;
  const img=new Image();
  img.onload=()=>{
    let html;
    if(mode==="ascii"){
      html='<pre class="pic-ascii">'+escapeHtml(asciiArt(img,80))+'</pre>';
    } else {
      const cv=document.createElement("canvas");
      processToCanvas(img,mode,cv);
      html='<img class="pic-out" src="'+cv.toDataURL("image/jpeg",0.85)+'" alt="processed">';
    }
    picCache[key]=html;
    if(view==="quiz"&&pictureRound){
      const cur=pictureRound.items[currentIdx];
      const curMode=pictureRound.modes[currentIdx];
      if(cur&&cur.id===item.id&&curMode===mode)render();
    }
  };
  img.onerror=()=>{picCache[key]='<div class="pic-loading">Image failed to load</div>'};
  img.src="images/picture-bank/"+item.filename;
}

function toggleHint(i){hintShown.has(i)?hintShown.delete(i):hintShown.add(i);render()}

function goTopics(){view="topics";activeTopic=null;activeRound=null;revealed=new Set();render();window.scrollTo({top:0,behavior:"smooth"})}
function goRounds(tid){activeTopic=TOPICS.find(t=>t.id===tid);view="rounds";activeRound=null;revealed=new Set();render();window.scrollTo({top:0,behavior:"smooth"})}
async function goQuiz(rid){
  view="quiz";revealed=new Set();hintShown=new Set();currentIdx=0;
  activeRound=null;
  pictureRound=null;
  musicRound=null;
  render(); // loading state
  try{
    activeRound=await loadRound(rid);
  }catch(e){
    console.error(e);
    activeRound={id:rid,title:"(failed to load)",desc:e.message||String(e),questions:[]};
    render();
    return;
  }
  if(activeRound.type==="picture"){
    pictureRound=null;
    render();
    buildPictureRound().then(render).catch(e=>{console.error(e);render()});
  } else if(activeRound.type==="music"){
    musicRound=null;
    render();
    buildMusicRound().then(render).catch(e=>{console.error(e);render()});
  } else {
    render();
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
function toggleCard(i){revealed.has(i)?revealed.delete(i):revealed.add(i);render()}
function shuffleQuiz(){if(!activeRound||!activeRound.questions)return;revealed=new Set();hintShown=new Set();currentIdx=0;const q=activeRound.questions;for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}render();window.scrollTo({top:0,behavior:"smooth"})}
function resetQuiz(){revealed=new Set();hintShown=new Set();currentIdx=0;render()}
function currentTotal(){
  if(!activeRound)return 0;
  if(activeRound.type==="picture")return pictureRound?pictureRound.items.length:0;
  if(activeRound.type==="music")return musicRound?musicRound.items.length:0;
  return activeRound.questions?activeRound.questions.length:0;
}
function nextQ(){const t=currentTotal();if(activeRound&&currentIdx<t-1){currentIdx++;render()}}
function prevQ(){if(activeRound&&currentIdx>0){currentIdx--;render()}}

function renderTopics(){
  const idx=roundsIndex||[];
  return`<div class="hdr"><div class="hdr-title"><em>▸</em> Family Quiz Night</div></div>
  <div class="launcher"><div class="launcher-label">Pick a topic</div>
  <div class="topic-grid">${TOPICS.map((t,i)=>{
    const total=idx.filter(r=>r.topic===t.id).length;
    return`<div class="topic-cell" style="--tc:${t.color};animation-delay:${i*.06}s" onclick="goRounds('${t.id}')">
      <div class="topic-icon">${t.icon}</div><div class="topic-name">${t.name}</div>
      <div class="topic-count">${total} round${total!==1?'s':''}</div></div>`}).join("")}</div></div>`;
}

function renderRounds(){
  const rounds=(roundsIndex||[]).filter(r=>r.topic===activeTopic.id);
  return`<div class="hdr"><button class="btn-back" onclick="goTopics()">← Topics</button>
    <div class="hdr-title"><em>${activeTopic.icon}</em> ${activeTopic.name}</div></div>
  <div class="picker"><div class="round-grid">${rounds.map((r,i)=>
    `<div class="rcard" style="animation-delay:${i*.06}s" onclick="goQuiz('${r.id}')">
      <div class="rcard-stripe" style="background:${activeTopic.color}"></div>
      <div class="rcard-title">${r.title}</div>
      <div style="font-size:.72rem;color:var(--sub);line-height:1.35;margin-bottom:8px">${r.desc}</div>
      <div class="rcard-meta"><span class="rcard-count">${r.count?r.count+'Q':'∞'}</span>${r.isNew?'<span class="rcard-new">New</span>':''}</div>
    </div>`).join("")}</div></div>`;
}

function renderQuiz(){
  const type=activeRound.type||"standard";
  if(type==="picture")return renderPictureCarousel();
  if(type==="music")return renderMusicCarousel();
  if(type!=="standard")return renderCarousel(type);
  const qs=activeRound.questions;
  return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
    <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div>
    <div class="hdr-right"><div class="badge-sm">Revealed <strong>${revealed.size}</strong>/${qs.length}</div></div></div>
  <div class="grid">${qs.map((item,i)=>{const r=revealed.has(i);
    return`<div class="qcard${r?' show':''}" style="animation-delay:${i*.03}s" onclick="toggleCard(${i})">
      <div class="qi"><div class="qt"><span class="qn">Q${i+1}</span>
        <span class="qcat" style="color:${activeTopic.color}">${activeTopic.name}</span>
        ${r?"":'<span class="qhint">tap to reveal</span>'}</div>
      <div class="qtxt">${item.q}</div></div>
      <div class="qans"><div class="qansi"><div class="qal">Answer</div><div class="qat">${item.a}</div></div></div>
    </div>`;
  }).join("")}</div>
  <div class="fabs"><button class="fab sec" onclick="resetQuiz()">↩ Reset</button><button class="fab" onclick="shuffleQuiz()">↻ Shuffle</button></div>`;
}

function renderCarousel(type){
  // Currently only used by emoji rounds — picture rounds go via renderPictureCarousel.
  const qs=activeRound.questions;
  const total=qs.length;
  const item=qs[currentIdx];
  const r=revealed.has(currentIdx);
  const media=`<div class="emoji-q">${item.q}</div>`;
  const label="Emoji";
  return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
    <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div>
    <div class="hdr-right"><div class="badge-sm">Revealed <strong>${revealed.size}</strong>/${total}</div></div></div>
  <div class="car">
    <div class="car-body">
      <div class="car-card${r?' show':''}" onclick="toggleCard(${currentIdx})">
        <div class="car-meta">
          <span class="qn">Q${currentIdx+1} / ${total}</span>
          <span class="car-cat" style="color:${activeTopic.color}">${label}</span>
        </div>
        <div class="car-media">${media}</div>
        ${item.hint?`<div class="car-hint">${item.hint}</div>`:""}
        <div class="car-ans"><div class="car-ans-i"><div class="car-al">Answer</div><div class="car-at">${item.a}</div></div></div>
      </div>
    </div>
    <div class="car-nav">
      <button class="car-btn" onclick="prevQ()" ${currentIdx===0?'disabled':''}>← Prev</button>
      <button class="car-btn primary" onclick="toggleCard(${currentIdx})">${r?"Hide":"Reveal"}</button>
      <button class="car-btn" onclick="nextQ()" ${currentIdx===total-1?'disabled':''}>Next →</button>
    </div>
  </div>`;
}

function renderPictureCarousel(){
  if(!pictureRound){
    return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
      <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div></div>
    <div class="car"><div class="car-body"><div class="pic-loading">Loading picture bank…</div></div></div>`;
  }
  const total=pictureRound.items.length;
  if(!total){
    return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
      <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div></div>
    <div class="car"><div class="car-body"><div class="pic-loading">Picture bank is empty.</div></div></div>`;
  }
  const item=pictureRound.items[currentIdx];
  const mode=pictureRound.modes[currentIdx];
  const r=revealed.has(currentIdx);
  const hOn=hintShown.has(currentIdx);
  const modeLabel={blur:"Blurred",pixelate:"Pixelated",ascii:"ASCII",mosaic:"Scrambled"}[mode]||mode;

  let mediaHtml;
  if(r){
    mediaHtml=`<img class="pic-orig" src="images/picture-bank/${item.filename}" alt="${escapeHtml(item.answer)}">`;
  } else {
    const key=item.id+":"+mode;
    if(picCache[key]){
      mediaHtml=picCache[key];
    } else {
      buildProcessed(item,mode);
      mediaHtml='<div class="pic-loading">Processing…</div>';
    }
  }

  const hintBlock = r ? '' :
    (hOn
      ? `<div class="car-hint">${escapeHtml(item.hint||"No hint available")}</div>`
      : (item.hint?`<button class="pic-hint-btn" onclick="toggleHint(${currentIdx})">💡 Show Hint</button>`:''));

  return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
    <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div>
    <div class="hdr-right"><div class="badge-sm">Revealed <strong>${revealed.size}</strong>/${total}</div></div></div>
  <div class="car">
    <div class="car-body">
      <div class="car-card${r?' show':''}">
        <div class="car-meta">
          <span class="qn">Q${currentIdx+1} / ${total}</span>
          <span class="car-cat" style="color:${activeTopic.color}">${modeLabel}</span>
        </div>
        <div class="pic-host">${mediaHtml}</div>
        ${hintBlock}
        <div class="car-ans"><div class="car-ans-i"><div class="car-al">Answer</div><div class="car-at">${escapeHtml(item.answer)}</div></div></div>
      </div>
    </div>
    <div class="car-nav">
      <button class="car-btn" onclick="prevQ()" ${currentIdx===0?'disabled':''}>← Prev</button>
      <button class="car-btn primary" onclick="toggleCard(${currentIdx})">${r?"Hide":"Reveal"}</button>
      <button class="car-btn" onclick="nextQ()" ${currentIdx===total-1?'disabled':''}>Next →</button>
    </div>
  </div>`;
}

function renderMusicCarousel(){
  if(!musicRound){
    return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
      <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div></div>
    <div class="car"><div class="car-body"><div class="pic-loading">Loading music bank…</div></div></div>`;
  }
  const total=musicRound.items.length;
  if(!total){
    return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
      <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div></div>
    <div class="car"><div class="car-body"><div class="pic-loading">Music bank is empty.</div></div></div>`;
  }
  const item=musicRound.items[currentIdx];
  const r=revealed.has(currentIdx);
  const hOn=hintShown.has(currentIdx);
  const audioSrc=`audio/music-bank/${item.filename}`;

  const mediaHtml = r
    ? `<div class="music-revealed">
         <div class="music-title">${escapeHtml(item.title)}</div>
         <div class="music-artist">${escapeHtml(item.artist)}</div>
         ${item.album?`<div class="music-album">${escapeHtml(item.album)}</div>`:''}
         <audio class="music-player" src="${audioSrc}" controls preload="auto"></audio>
       </div>`
    : `<div class="music-mystery">
         <div class="music-icon">🎵</div>
         <audio class="music-player" src="${audioSrc}" controls preload="auto"></audio>
       </div>`;

  const hintBlock = r ? '' :
    (hOn
      ? `<div class="car-hint">${escapeHtml(item.hint||"No hint available")}</div>`
      : (item.hint?`<button class="pic-hint-btn" onclick="toggleHint(${currentIdx})">💡 Show Hint</button>`:''));

  return`<div class="hdr"><button class="btn-back" onclick="goRounds('${activeTopic.id}')">← Rounds</button>
    <div class="hdr-title" style="font-size:.78rem">${activeRound.title}</div>
    <div class="hdr-right"><div class="badge-sm">Revealed <strong>${revealed.size}</strong>/${total}</div></div></div>
  <div class="car">
    <div class="car-body">
      <div class="car-card${r?' show':''}">
        <div class="car-meta">
          <span class="qn">Q${currentIdx+1} / ${total}</span>
          <span class="car-cat" style="color:${activeTopic.color}">Music</span>
        </div>
        <div class="music-host">${mediaHtml}</div>
        ${hintBlock}
      </div>
    </div>
    <div class="car-nav">
      <button class="car-btn" onclick="prevQ()" ${currentIdx===0?'disabled':''}>← Prev</button>
      <button class="car-btn primary" onclick="toggleCard(${currentIdx})">${r?"Hide":"Reveal"}</button>
      <button class="car-btn" onclick="nextQ()" ${currentIdx===total-1?'disabled':''}>Next →</button>
    </div>
  </div>`;
}

function loadingHtml(msg){return `<div style="padding:60px 20px;text-align:center;color:var(--sub);font-size:.9rem">${msg}</div>`}
function errorHtml(msg){return `<div style="padding:60px 20px;text-align:center;color:#ef4444;font-size:.9rem">⚠ ${msg}</div>`}

function render(){
  let html;
  if(bootstrapError) html=errorHtml("Failed to load quiz data: "+bootstrapError);
  else if(!roundsIndex) html=loadingHtml("Loading quiz data…");
  else if(view==="topics") html=renderTopics();
  else if(view==="rounds") html=renderRounds();
  else if(view==="quiz" && !activeRound) html=loadingHtml("Loading round…");
  else html=renderQuiz();
  document.getElementById("app").innerHTML=html;
}

render();
bootstrap();
</script>
</body>
</html>
