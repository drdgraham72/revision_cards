const eraBadgeClass = {
  "Early Britain":"badge-Early",
  "Middle Ages":"badge-Medieval",
  "Tudors & Stuarts":"badge-Tudor",
  "Empire & Industry":"badge-Empire",
  "20th Century":"badge-20C",
  "Modern Britain":"badge-Modern"
};

const eraBar = document.getElementById('era-filters');
const typeBar = document.getElementById('type-filters');
const counterEl = document.getElementById('counter');
const gridEl = document.getElementById('grid');

let activeEra = 'All';
let activeType = 'All';

ERAS.forEach(e => {
  const b = document.createElement('button');
  b.className = 'fbtn' + (e==='All' ? ' active' : '');
  b.dataset.era = e;
  b.textContent = e;
  b.onclick = () => { activeEra = e; document.querySelectorAll('.fbtn[data-era]').forEach(x => x.classList.toggle('active', x.dataset.era===e)); render(); };
  eraBar.appendChild(b);
});
TYPES.forEach(t => {
  const b = document.createElement('button');
  b.className = 'fbtn' + (t==='All' ? ' active' : '');
  b.dataset.type = t;
  b.textContent = t;
  b.onclick = () => { activeType = t; document.querySelectorAll('.fbtn[data-type]').forEach(x => x.classList.toggle('active', x.dataset.type===t)); render(); };
  typeBar.appendChild(b);
});

function render() {
  gridEl.innerHTML = '';
  let filtered = cards.slice();
  if (activeEra !== 'All') filtered = filtered.filter(c => c.era === activeEra);
  if (activeType !== 'All') filtered = filtered.filter(c => c.type === activeType);
  counterEl.textContent = filtered.length + ' card' + (filtered.length !== 1 ? 's' : '');
  filtered.forEach(c => {
    const badgeClass = eraBadgeClass[c.era] || '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div><span class="era-badge ${badgeClass}">${c.era}</span></div>
        <div style="text-align:right">
          <div class="type-tag">${c.type}</div>
          <div class="date-tag">${c.date}</div>
        </div>
      </div>
      <div class="term">${c.term}</div>
      <div class="mnemonic">&#9670; ${c.mnemonic}</div>
      <div class="summary">${c.summary}</div>
      <div class="back">
        <div class="detail">${c.detail}</div>
        <div class="exam-box">
          <div class="exam-label">Exam angle</div>
          ${c.exam}
        </div>
      </div>
      <div class="tap-hint">tap to reveal detail + exam angle</div>
    `;
    card.onclick = () => { card.classList.toggle('flipped'); card.querySelector('.tap-hint').textContent = card.classList.contains('flipped') ? 'tap to hide' : 'tap to reveal detail + exam angle'; };
    gridEl.appendChild(card);
  });
}
render();
</script>
