<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-tertiary: #888780;
    --border-light: rgba(0,0,0,0.12);

      --bg-primary: #1e1e1c;
      --bg-secondary: #2a2a28;
      --text-primary: #f0ece4;
      --text-secondary: #a8a59e;
      --text-tertiary: #807d76;
      --border-light: rgba(255,255,255,0.10);
      --border-mid: rgba(255,255,255,0.20);
    }
  }
  body { font-family: var(--font); background: var(--bg-secondary); color: var(--text-primary); padding: 2rem 1rem; min-height: 100vh; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 0.2rem; }
  .subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 1.4rem; }

  .filter-row { margin-bottom: 0.9rem; }
  .filter-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .fbtn { font-size: 12px; padding: 4px 11px; border-radius: 20px; border: 0.5px solid var(--border-mid); background: var(--bg-primary); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .fbtn.active { border-color: transparent; color: #fff; }

  .fbtn[data-cat="All"].active        { background: #444441; }
  .fbtn[data-cat="Customs"].active    { background: #C8102E; }
  .fbtn[data-cat="Religion"].active   { background: #534AB7; }
  .fbtn[data-cat="Sport"].active      { background: #185FA5; }
  .fbtn[data-cat="Arts"].active       { background: #854F0B; }
  .fbtn[data-cat="Geography"].active  { background: #3B6D11; }
  .fbtn[data-cat="People"].active     { background: #993556; }
  .fbtn[data-cat="Holidays"].active   { background: #0f6e56; }

  .counter { font-size: 13px; color: var(--text-secondary); margin: 0.9rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }

  .card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); padding: 1rem 1.2rem; cursor: pointer; user-select: none; min-height: 200px; display: flex; flex-direction: column; gap: 7px; transition: border-color 0.15s; }
  .card:hover { border-color: var(--border-mid); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .cat-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .badge-Customs   { background: #FCEBEB; color: #C8102E; }
  .badge-Religion  { background: #eeedfe; color: #534AB7; }
  .badge-Sport     { background: #E6F1FB; color: #185FA5; }
  .badge-Arts      { background: #faeeda; color: #854F0B; }
  .badge-Geography { background: #EAF3DE; color: #3B6D11; }
  .badge-People    { background: #fbeaf0; color: #993556; }
  .badge-Holidays  { background: #e1f5ee; color: #0f6e56; }

  .term { font-size: 14px; font-weight: 500; color: var(--text-primary); line-height: 1.35; }
  .mnemonic { font-size: 12px; color: var(--text-secondary); border-left: 2px solid var(--border-mid); padding-left: 8px; }
  .summary { font-size: 13px; color: var(--text-secondary); line-height: 1.55; flex-grow: 1; }
  .back { display: none; flex-direction: column; gap: 8px; margin-top: 2px; }
  .card.flipped .back { display: flex; }
  .card.flipped .summary { font-size: 12px; color: var(--text-tertiary); }
  .detail { font-size: 13px; color: var(--text-secondary); line-height: 1.6; border-top: 0.5px solid var(--border-light); padding-top: 8px; }
  .exam-box { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 7px 10px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .exam-label { font-size: 10px; font-weight: 500; color: #185FA5; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .tap-hint { font-size: 11px; color: var(--text-tertiary); text-align: right; margin-top: auto; }

  @media (max-width: 768px) {
    body { font-size: 16px; padding: 1rem 0.7rem 3rem; }
    .term { font-size: 15px; }
    .summary { font-size: 14px; }
    .detail { font-size: 14px; }
  }
</style>

const catBadgeClass = {
  "Customs":"badge-Customs",
  "Religion":"badge-Religion",
  "Sport":"badge-Sport",
  "Arts":"badge-Arts",
  "Geography":"badge-Geography",
  "People":"badge-People",
  "Holidays":"badge-Holidays"
};

const catBar = document.getElementById('cat-filters');
const counterEl = document.getElementById('counter');
const gridEl = document.getElementById('grid');
let activeCat = 'All';

CATS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'fbtn' + (c==='All' ? ' active' : '');
  b.dataset.cat = c;
  b.textContent = c;
  b.onclick = () => { activeCat = c; document.querySelectorAll('.fbtn[data-cat]').forEach(x => x.classList.toggle('active', x.dataset.cat===c)); render(); };
  catBar.appendChild(b);
});

function render() {
  gridEl.innerHTML = '';
  let filtered = cards.slice();
  if (activeCat !== 'All') filtered = filtered.filter(c => c.cat === activeCat);
  counterEl.textContent = filtered.length + ' card' + (filtered.length !== 1 ? 's' : '');
  filtered.forEach(c => {
    const badgeClass = catBadgeClass[c.cat] || '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div><span class="cat-badge ${badgeClass}">${c.cat}</span></div>
      </div>
      <div class="term">${c.term}</div>
      <div class="mnemonic">&#9670; ${c.mnemonic}</div>
      <div class="summary">${c.summary}</div>
      <div class="back">
        <div class="detail">${c.detail}</div>
        <div class="exam-box">
          <div class="exam-label">Exam angle</div>
          ${c.exam}
        </div>
      </div>
      <div class="tap-hint">tap to reveal detail + exam angle</div>
    `;
    card.onclick = () => { card.classList.toggle('flipped'); card.querySelector('.tap-hint').textContent = card.classList.contains('flipped') ? 'tap to hide' : 'tap to reveal detail + exam angle'; };
    gridEl.appendChild(card);
  });
}
render();
</script>

<script src="../shared/youtube-button.js" defer></script>
</body>
</html>
